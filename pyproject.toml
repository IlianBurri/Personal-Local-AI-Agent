[tool.poetry]
name = "arca"
version = "0.1.0"
description = "Desktop AI agent that supports Anthropic, OpenAI and local Ollama backends."
authors = ["Ilian Burri"]

[tool.poetry.dependencies]
python = ">=3.10"
PyQt6 = "6.11.0"
openai = "2.46.0"
anthropic = "0.117.0"
requests = "2.34.2"
pygments = "2.20.0"
pyinstaller = "6.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
flake8 = "7.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.vercel]
entrypoint = "api.index:app"
