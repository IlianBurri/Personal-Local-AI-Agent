[tool.poetry]
name = "arca"
version = "0.1.0"
description = "Desktop AI agent that supports Anthropic, OpenAI and local Ollama backends."
authors = ["Ilian Burri"]

[tool.poetry.dependencies]
python = ">=3.10"
PyQt6 = "6.6.0"
openai = "1.32.0"
anthropic = "0.34.0"
requests = "2.31.0"
pygments = "2.16.1"
pyinstaller = "5.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.2"
flake8 = "6.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
