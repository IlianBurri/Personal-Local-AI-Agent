<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Arca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #F2F0EB;
      --surface:  #FAFAF7;
      --border:   #E0DED8;
      --text:     #18180F;
      --muted:    #888880;
      --subtle:   #B0AEA8;
      --accent:   #3A5C8C;
      --accent-h: #2E4A73;
      --sidebar:  #ECEAE4;
      --mono:     'DM Mono', monospace;
      --sans:     'DM Sans', system-ui, sans-serif;
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); }

    body {
      font-family: var(--sans);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 18px 14px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .wordmark {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .new-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 11px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--accent);
      cursor: pointer;
      transition: background 0.12s;
    }
    .new-btn:hover { background: rgba(0,0,0,0.04); }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .conv-list::-webkit-scrollbar { width: 4px; }
    .conv-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .conv-item {
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s, color 0.1s;
      user-select: none;
    }
    .conv-item:hover { background: rgba(0,0,0,0.05); color: var(--text); }
    .conv-item.active { background: #E2DFD8; color: var(--text); }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-family: var(--mono);
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--subtle);
      margin-bottom: 3px;
    }

    select, .text-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, .text-input:focus { border-color: var(--accent); }

    /* ── Main ── */
    .main {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      padding: 0 28px;
      height: 48px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-shrink: 0;
    }
    .topbar-title {
      font-size: 13px;
      color: var(--muted);
      font-family: var(--mono);
    }
    .topbar-badge {
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 0 8px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Empty */
    .empty {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
    }
    .empty-mark {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--text);
      opacity: 0.15;
    }
    .empty-hint {
      font-size: 13px;
      color: var(--subtle);
      font-weight: 300;
    }

    /* Message rows */
    .msg-row {
      display: flex;
      padding: 3px 28px;
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 66%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble.error {
      background: #FFF0F0;
      border-color: #F5C6C6;
      color: #8B0000;
    }

    /* Code blocks inside assistant bubble */
    .code-block {
      margin: 8px 0;
      background: #1E1E1E;
      border-radius: 8px;
      overflow: hidden;
      font-size: 12.5px;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 12px;
      background: #2A2A2A;
    }
    .code-lang {
      font-family: var(--mono);
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .copy-btn {
      font-family: var(--mono);
      font-size: 10px;
      color: #888;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
      transition: color 0.15s, background 0.15s;
    }
    .copy-btn:hover { color: #fff; background: #444; }
    .code-pre {
      padding: 12px 14px;
      overflow-x: auto;
      font-family: var(--mono);
      color: #D4D4D4;
      line-height: 1.6;
      margin: 0;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 4px 0;
    }
    .typing-dots span {
      width: 6px; height: 6px;
      background: var(--subtle);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* ── Input ── */
    .input-zone {
      padding: 12px 28px 18px;
      flex-shrink: 0;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-box:focus-within {
      border-color: #B0B8C8;
      box-shadow: 0 0 0 3px rgba(58,92,140,0.06);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--sans);
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
      max-height: 180px;
      min-height: 22px;
    }
    textarea::placeholder { color: var(--subtle); }

    .send {
      width: 34px; height: 34px;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .send:hover { background: var(--accent-h); transform: translateY(-1px); }
    .send:disabled { opacity: 0.35; cursor: default; transform: none; }
    .send svg { width: 15px; height: 15px; color: white; }

    .input-hint {
      text-align: center;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--subtle);
      margin-top: 7px;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .msg-row { padding: 3px 14px; }
      .bubble { max-width: 90%; }
      .input-zone { padding: 10px 14px 14px; }
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="wordmark">arca</div>
      <button class="new-btn" onclick="newChat()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-footer">
      <div>
        <div class="field-label">Provider</div>
        <select id="provSel" onchange="onProviderChange()">
          <option value="anthropic">Anthropic</option>
          <option value="openai">OpenAI</option>
          <option value="ollama">Ollama</option>
        </select>
      </div>
      <div>
        <div class="field-label">Model <span style="text-transform:none;letter-spacing:0">(optional)</span></div>
        <input class="text-input" id="modelIn" type="text" placeholder="default"/>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <span class="topbar-title">New conversation</span>
      <span class="topbar-badge" id="topBadge">anthropic</span>
    </div>

    <div class="messages" id="msgs">
      <div class="empty" id="empty">
        <div class="empty-mark">arca</div>
        <div class="empty-hint">Start a conversation</div>
      </div>
    </div>

    <div class="input-zone">
      <div class="input-box">
        <textarea id="inp" rows="1" placeholder="Message…"
          onkeydown="onKey(event)" oninput="resize(this)"></textarea>
        <button class="send" id="sendBtn" onclick="send()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </main>
</div>

<script>
/* ── State ── */
let history = [];
let convs = [];
let activeId = null;
let busy = false;

/* ── Helpers ── */
function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function onProviderChange() {
  document.getElementById('topBadge').textContent =
    document.getElementById('provSel').value;
}

function scrollBottom() {
  const m = document.getElementById('msgs');
  m.scrollTop = m.scrollHeight;
}

/* ── Conversations ── */
function newChat() {
  if (history.length) saveCurrentConv();
  history = [];
  activeId = Date.now();
  document.getElementById('msgs').innerHTML =
    `<div class="empty" id="empty"><div class="empty-mark">arca</div><div class="empty-hint">Start a conversation</div></div>`;
  document.querySelector('.topbar-title').textContent = 'New conversation';
  renderConvList();
}

function saveCurrentConv() {
  if (!history.length) return;
  const title = history[0]?.content?.slice(0, 38) || 'Conversation';
  const existing = convs.findIndex(c => c.id === activeId);
  if (existing >= 0) {
    convs[existing] = { id: activeId, title, history: [...history] };
  } else {
    convs.unshift({ id: activeId || Date.now(), title, history: [...history] });
  }
  renderConvList();
}

function renderConvList() {
  document.getElementById('convList').innerHTML = convs.map(c => `
    <div class="conv-item ${c.id === activeId ? 'active' : ''}"
         onclick="loadConv(${c.id})">${c.title}</div>`).join('');
}

function loadConv(id) {
  if (busy) return;
  saveCurrentConv();
  const c = convs.find(x => x.id === id);
  if (!c) return;
  activeId = id;
  history = [...c.history];
  const el = document.getElementById('msgs');
  el.innerHTML = '';
  history.forEach(m => addBubble(m.role, m.content));
  document.querySelector('.topbar-title').textContent = c.title;
  renderConvList();
  scrollBottom();
}

/* ── Rendering ── */
function addBubble(role, text) {
  const empty = document.getElementById('empty');
  if (empty) empty.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const bub = document.createElement('div');
  bub.className = `bubble ${role}`;

  if (role === 'assistant') {
    bub.innerHTML = renderContent(text);
  } else {
    bub.textContent = text;
  }

  row.appendChild(bub);
  document.getElementById('msgs').appendChild(row);
  scrollBottom();
  return bub;
}

function renderContent(text) {
  if (!text.includes('```')) return escHtml(text);
  const parts = text.split(/(```[\s\S]*?```)/g);
  return parts.map(p => {
    if (p.startsWith('```')) {
      const inner = p.slice(3, -3);
      const nl = inner.indexOf('\n');
      const lang = nl > 0 ? inner.slice(0, nl).trim() : '';
      const code = nl > 0 ? inner.slice(nl + 1) : inner;
      const id = 'cb' + Math.random().toString(36).slice(2);
      return `<div class="code-block">
        <div class="code-header">
          <span class="code-lang">${escHtml(lang || 'code')}</span>
          <button class="copy-btn" onclick="copyCode('${id}')">Copy</button>
        </div>
        <pre class="code-pre" id="${id}">${escHtml(code)}</pre>
      </div>`;
    }
    return `<span style="white-space:pre-wrap">${escHtml(p)}</span>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyCode(id) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => {
    const btn = el.parentElement?.querySelector('.copy-btn');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
  });
}

/* ── Streaming send ── */
async function send() {
  if (busy) return;
  const inp = document.getElementById('inp');
  const msg = inp.value.trim();
  if (!msg) return;

  inp.value = '';
  inp.style.height = 'auto';
  busy = true;
  document.getElementById('sendBtn').disabled = true;

  addBubble('user', msg);
  history.push({ role: 'user', content: msg });

  // Assistant bubble with typing dots
  const aRow = document.createElement('div');
  aRow.className = 'msg-row assistant';
  const aBub = document.createElement('div');
  aBub.className = 'bubble assistant';
  aBub.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  aRow.appendChild(aBub);
  document.getElementById('msgs').appendChild(aRow);
  scrollBottom();

  const provider = document.getElementById('provSel').value;
  const model = document.getElementById('modelIn').value.trim() || null;

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        provider,
        model,
        history: history.slice(0, -1)
      })
    });

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let full = '';
    let buf = '';
    let first = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const tok = JSON.parse(line.slice(6));
          if (first) { aBub.innerHTML = ''; first = false; }
          full += tok;
          aBub.innerHTML = renderContent(full);
          scrollBottom();
        } catch {}
      }
    }

    history.push({ role: 'assistant', content: full });
    saveCurrentConv();
    // Update topbar title
    if (history.length === 2) {
      const title = history[0].content.slice(0, 38);
      document.querySelector('.topbar-title').textContent = title;
    }
  } catch (e) {
    aBub.className = 'bubble error';
    aBub.textContent = 'Error: ' + e.message;
  }

  busy = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('inp').focus();
}

onProviderChange();
</script>
</body>
</html>
